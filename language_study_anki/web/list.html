<!--
  Article-list template (Hub list page). Consumed by language_study_anki/hub.py:
  the file is read once at module load and passed to QWebEngine as a string.

  Contract with hub.py (keep both ends in sync when editing):
    Placeholder (string-replaced before setHtml; NAME wrapped in double
    underscores, e.g. __ + NAME + __ — written split here on purpose so the
    literal token never appears in this comment and the Python-side
    str.replace cannot corrupt the comment):
      LSA_DATA    JSON payload {rows:[{id,title,cover,pcts:{reading,
                  speaking,listening,writing}}]}
    Bridge commands (JS -> Python via pycmd):
      lsa:open:<note_id>:<mode>   enter practice for that row's skill entry
    Row layout: cover thumbnail at the row's left when the row's cover
    value is non-empty, plus a content block of title and four skill
    entries in reading, speaking, listening, writing order; each entry
    is a button showing a circular progress ring (arc length = the
    skill's percentage, 0% = empty track, 100% = full ring, single
    accent color) with the integer percent centered inside the ring and
    the skill name below it. The self-test reads the .pct and .name
    sub-elements of each .skill entry (not the button's whole text).
    A row whose cover is empty renders the same title + skills with no
    thumbnail (no placeholder in its place). Empty rows -> empty state
    message instead of rows.

  Cover image URLs (Anki >= 2.1.50 media-server model):
    AnkiWebView.setHtml serves this page from
    http://127.0.0.1:<port>/_anki/legacyPageData?id=N, so a bare relative
    src="foo.jpg" would resolve to /_anki/foo.jpg — Anki's internal web
    asset namespace — and 404 (media files are served from the server
    root). The <base href="/"> below re-bases every relative URL in the
    page to the server root, where the media server maps the path to the
    collection media folder. Keep it; the static test in test_hub.py
    guards its presence.
-->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><base href="/"><style>
body { font-family: sans-serif; margin: 0; background: #fafafa; color: #222; }
#list { padding: 10px 14px; }
.row { background: #fff; border: 1px solid #e3e3e5; border-radius: 6px;
  padding: 10px 12px; margin-bottom: 8px; display: flex; align-items:
  flex-start; gap: 12px; }
/* Cover thumbnail: fixed max height, aspect ratio preserved by keeping
   intrinsic sizing and cropping only overflow (spec: practice-hub ->
   Article list page). */
.row .cover { flex: none; }
.row .cover img { display: block; max-height: 96px; width: auto;
  max-width: 160px; border-radius: 4px; object-fit: cover; }
.row .content { min-width: 0; flex: 1; }
.title { font-size: 14px; font-weight: 600; margin-bottom: 8px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.skills { display: flex; gap: 8px; flex-wrap: wrap; }
/* Skill entries are the only activatable part of a row (spec:
   practice-hub -> List-to-practice navigation). Each is a small vertical
   cell: a circular progress ring (arc length = percentage) with the
   integer percent centered inside, and the skill name below. Single
   accent color for every ring; magnitude is carried by arc length alone
   (design D2). */
.skill { border: none; background: none; cursor: pointer; padding: 4px 6px;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  border-radius: 6px; }
.skill:hover { background: #ececec; }
.skill .ring { position: relative; width: 40px; height: 40px; }
.skill .ring svg { display: block; width: 40px; height: 40px;
  transform: rotate(-90deg); }  /* arc starts at 12 o'clock, Flutter-style */
.skill .ring .track { fill: none; stroke: #e3e3e5; stroke-width: 3; }
.skill .ring .value { fill: none; stroke: #3b82f6; stroke-width: 3;
  stroke-linecap: butt; }
.skill .ring .pct { position: absolute; inset: 0; display: flex;
  align-items: center; justify-content: center; font-size: 11px;
  color: #555; }
.skill .name { font-size: 11px; color: #666; }
.empty { padding: 60px 20px; text-align: center; color: #888;
  font-size: 18px; }
</style></head>
<body>
<div id="list"></div>
<script>
const D = __LSA_DATA__;
const ORDER = ["reading", "speaking", "listening", "writing"];
const LABELS = {reading: "Reading", speaking: "Speaking",
                listening: "Listening", writing: "Writing"};

function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

// Circular progress ring (spec: practice-hub -> Article list page).
// r=15.5 in a 0 0 36 36 viewBox -> circumference C = 2*pi*15.5 ~ 97.39.
// The value arc is a full circle with dashoffset = C*(1 - pct/100), so
// offset C hides the whole arc (0%) and offset 0 shows it complete (100%).
const RING_R = 15.5;
const RING_C = 2 * Math.PI * RING_R;
function ring(pct){
  const off = RING_C * (1 - Math.max(0, Math.min(100, pct)) / 100);
  return '<span class="ring">' +
    '<svg viewBox="0 0 36 36">' +
    '<circle class="track" cx="18" cy="18" r="' + RING_R + '"></circle>' +
    '<circle class="value" cx="18" cy="18" r="' + RING_R + '"' +
    ' stroke-dasharray="' + RING_C + '" stroke-dashoffset="' + off +
    '"></circle></svg>' +
    '<span class="pct">' + pct + '%</span></span>';
}

const list = document.getElementById('list');
if (!D.rows || D.rows.length === 0) {
  list.innerHTML = '<div class="empty">No articles yet</div>';
} else {
  let html = '';
  for (const r of D.rows) {
    let skills = '';
    for (const m of ORDER) {
      const pct = (r.pcts && r.pcts[m]) || 0;
      skills += '<button class="skill" data-open="' + r.id + ':' + m + '">' +
                ring(pct) + '<span class="name">' + esc(LABELS[m]) +
                '</span></button>';
    }
    // Cover is user-maintained HTML (typically an <img> pointing into the
    // collection media folder), rendered as-is rather than escaped — the
    // row is built with a template string below. An empty cover renders
    // no thumbnail and no placeholder.
    const cover = r.cover ? '<div class="cover">' + r.cover + '</div>' : '';
    html += '<div class="row" data-id="' + r.id + '">' + cover +
            '<div class="content"><div class="title">' + esc(r.title) +
            '</div><div class="skills">' + skills + '</div></div></div>';
  }
  list.innerHTML = html;
}

list.addEventListener('click', function(e){
  const b = e.target.closest('[data-open]');
  if (b) pycmd('lsa:open:' + b.dataset.open);
});
</script>
</body></html>
